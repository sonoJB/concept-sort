name: Concept Analysis Cross-Validation

# Manual-only. No push/pull_request/schedule trigger — this workflow must
# never run automatically, and must never be able to affect Railway (which
# is configured to deploy only from the `main` branch's own GitHub push
# events, confirmed separately via the Railway API). This job does not
# touch Railway, production data, or any secret.
#
# History: a one-shot, path-restricted push trigger (scoped to exactly this
# feature branch and exactly analysis-prototype/ci-trigger.txt) was added
# temporarily in commit "Trigger concept analysis validation on feature
# branch" solely so GitHub Actions could discover this workflow at all
# (workflow_dispatch-only workflows on a non-default branch are invisible to
# the dispatch API — GET .../actions/workflows returned total_count: 0
# before that commit). That first attempt (run 31102381986) failed at the
# `npm ci` / `prisma generate` environment step (DATABASE_URL required by
# prisma.config.ts, which this workflow must not set) before any
# statistical comparison ran, and the trigger was removed afterward.
#
# Attempt 2 (run 31103725730) reused that same temporary trigger after
# changing `npm ci` to `npm ci --ignore-scripts`. The Node job (including the
# full internal test suite) passed, but the Python and R reference jobs both
# failed at the environment/script level (an incorrect sklearn `init` shape
# in ci_python.py, and a CRAN dependency-resolution failure for the `smacof`
# package's transitive deps in the R job) before any cross-language
# statistical comparison could run. Final verification status: NOT_RUN. The
# push trigger was removed afterward, restoring manual-only dispatch.
#
# Attempt 3 (run 31106809126) reused that same temporary trigger after (1)
# fixing ci_python.py's init-shape bug and (2) switching the R job to
# r-lib/actions/setup-r-dependencies@v2 with public RSPM binaries. Both
# harness fixes worked, but ci_r.R crashed at runtime ("Error in row[[j]] :
# subscript out of bounds" — matrix_from_list() assumed every matrix is
# square, which is false for the n x dimension init array), and real
# TS-vs-Python numeric comparisons FAILED: a SMACOF stress/distance
# discrepancy on zeroFree, and a Ward partition mismatch at k=4/k=5 despite
# byte-identical linkage — traced to ci_python.py's
# fcluster(criterion="maxclust"), which does not guarantee exactly k
# clusters. Final verification status: FAILED. Push trigger removed after.
#
# Attempt 4 (run 31109702124) reused that same temporary trigger with (1)
# ci_r.R's matrix conversion fixed (infers each input's actual shape instead
# of assuming square) — R now runs successfully end to end; (2)
# ci_python.py's Ward exact-k partitions switched to
# scipy.cluster.hierarchy.cut_tree — Ward-Linkage, Ward-Partition (python),
# and Ward (r) all PASSED, confirming Ward is fully correct across all three
# implementations; (3) a current scikit-learn (1.9.0) job as the primary
# reference plus the original 1.5.1 pin as a legacy diagnostic-only
# comparison. SMACOF itself still FAILED all three required checks, but with
# a very different, better-understood signature than attempt 3: stress
# values now match TS to ~1e-9 (both converge to the same objective value),
# while pairwise distances differ by a large, CONSTANT scale factor —
# consistent with Kruskal Stress-1 being scale-invariant (multiple
# same-shape, different-scale configurations can be equally optimal).
# Fixed-iteration snapshots showed iteration 0 (raw init) is byte-identical
# across TS/Python/R, but iteration 1 already diverges — pointing at the
# disparity-fitting step (this fixture has exact ties in dissimilarity
# despite its "zeroFree" name only guaranteeing no off-diagonal zeros) as
# the most likely first divergence point, not a convergence-criterion or
# update-formula bug. No statistical algorithm code
# (src/lib/conceptAnalysis/**) was touched. Final verification status:
# FAILED (not VERIFIED). The push trigger was removed after, restoring
# manual-only dispatch.
#
# Attempt 5 (run 31112857902) reused that same temporary trigger for a
# diagnostic-only round. Results: (1) the new tie-free "strictNoTies"
# fixture ALSO shows a small SCALE_EQUIVALENT gap (bestFitScale≈1.0099,
# similarity-Procrustes RMS≈2.1e-4) — since it has zero ties, this rules out
# tie-handling as the (sole) root cause; (2) zeroFree's divergence is now
# fully explained as SCALE_EQUIVALENT (similarity-Procrustes RMS≈8e-6,
# essentially exact after allowing scale) with identical tie-block structure
# vs both Python and R; (3) direct read-only source inspection of installed
# scikit-learn found the literal line `disparities *= np.sqrt(...)` in
# _mds.py (a disparity renormalization step TS's fitDisparities() in
# smacof.ts does not perform — confirmed by code audit), and R's smacof
# package namespace exposes normDiss/normDissN-named internals consistent
# with the same pattern — a source-grounded root-cause candidate for the
# scale drift, not a bug in the Guttman update itself; (4) the `ties`
# fixture's canonical (scale-normalized) DISPARITY comparison still FAILED
# (5.4e-2 vs 1e-3 tolerance) even though canonical DISTANCE matched almost
# exactly and tie-block structure matched exactly — an unresolved secondary
# finding for a future round. No statistical algorithm code
# (src/lib/conceptAnalysis/**) was touched. Final verification status:
# FAILED (not VERIFIED — 2 of 11 required checks still fail). The push
# trigger was removed after, restoring manual-only dispatch.
#
# TEMPORARY (attempt 6): the same one-shot, path-restricted push trigger is
# re-added below for the FIRST engine change in this whole cross-validation
# process: src/lib/conceptAnalysis/smacof.ts now normalizes disparities
# (via a new src/lib/conceptAnalysis/disparityNormalization.ts helper) to
# the classical q=n(n-1)/2 target norm after weighted PAVA and before Stress
# computation / the Guttman transform — matching the confirmed behavior of
# scikit-learn (source-inspected: `disparities *= np.sqrt(...)` in _mds.py)
# and R's smacof package (normDiss/normDissN internals). No other engine
# logic changed: weighted PAVA (isotonic.ts), the Guttman transform formula,
# the pseudo-inverse, Stress-1's definition, Ward, and the seeded PRNG are
# all untouched — confirmed via `git diff` scope before commit. All 233
# pre-existing tests plus 74 new disparity-normalization tests (307 total)
# pass locally with no regressions, no STRESS_INCREASED trips, and exact
# seeded reproducibility preserved. Removed again in a follow-up commit
# ("Restore manual-only workflow after disparity validation") right after
# this run.
on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/concept-map-analysis-prototype
    paths:
      - analysis-prototype/ci-trigger.txt

permissions:
  contents: read

env:
  # Pinned versions, recorded again in job output/artifact metadata so the
  # exact environment used is always traceable from the artifact alone.
  PYTHON_VERSION: "3.12"
  # Legacy Python reference pin — unchanged since attempt 1, kept as a
  # diagnostic-only comparison in attempt 4 (never gates VERIFIED).
  NUMPY_VERSION_LEGACY: "1.26.4"
  SCIPY_VERSION_LEGACY: "1.13.1"
  SCIKIT_LEARN_VERSION_LEGACY: "1.5.1"
  # Current Python reference pin — the primary/gating reference in attempt
  # 4. Only scikit-learn's version is pinned explicitly; numpy/scipy are
  # left to pip's own dependency resolution against that scikit-learn
  # version (rather than guessing a numpy/scipy pin by hand) — the actually
  # resolved versions are recorded in python-version-metadata.json by
  # ci_python.py itself at runtime, so nothing is left untraceable.
  SCIKIT_LEARN_VERSION_CURRENT: "1.9.0"
  R_VERSION: "4.4.1"

jobs:
  node-reference-inputs:
    name: A. node-reference-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record environment metadata
        run: |
          mkdir -p artifacts/metadata
          node --version
          node -e "console.log(JSON.stringify({nodeVersion: process.version, platform: process.platform, arch: process.arch, runnerOs: process.env.RUNNER_OS}, null, 2))" > artifacts/metadata/environment.json
          cat artifacts/metadata/environment.json

      # --ignore-scripts: this prototype never imports the generated Prisma
      # client, so the postinstall `prisma generate` hook (which requires
      # DATABASE_URL, forbidden in this workflow) is unnecessary and skipped.
      - name: npm ci --ignore-scripts
        run: npm ci --ignore-scripts

      - name: Verify Node/npm/tsx are actually usable after --ignore-scripts
        run: |
          node --version
          npm --version
          npx -y tsx --version
          node -e "console.log('node-runtime-ok')"

      - name: Run internal verification suite (Node 22)
        run: npx -y tsx analysis-prototype/scripts/verify.ts

      - name: Hand-derived checks (Node 22)
        run: |
          npx -y tsx analysis-prototype/scripts/handcheck.ts
          npx -y tsx analysis-prototype/scripts/handcheck_ward.ts

      - name: Export shared fixtures (fixed dissimilarity/weight/initial-coordinates)
        run: |
          mkdir -p artifacts/inputs
          npx -y tsx analysis-prototype/scripts/exportFixtures.ts artifacts/inputs/fixtures.json

      - name: Export diagnostic fixtures (strictNoTies)
        run: npx -y tsx analysis-prototype/scripts/exportDiagnosticFixtures.ts artifacts/inputs/diagnostic-fixtures.json

      - name: Run TypeScript reference (shared-init SMACOF, Ward, dimension diagnostics, diagnostic fixtures)
        run: |
          mkdir -p artifacts/typescript
          npx -y tsx analysis-prototype/scripts/runTsReference.ts artifacts/inputs/fixtures.json artifacts/typescript artifacts/inputs/diagnostic-fixtures.json

      - name: Upload node-reference-inputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-reference-inputs
          path: artifacts
          retention-days: 7

  python-reference-current:
    name: B1. python-reference-current (scikit-learn 1.9.0, primary/gating)
    runs-on: ubuntu-latest
    needs: node-reference-inputs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install current scikit-learn (numpy/scipy resolved by pip)
        run: |
          pip install "scikit-learn==${{ env.SCIKIT_LEARN_VERSION_CURRENT }}"
          python --version
          python -c "import numpy, scipy, sklearn; print('numpy', numpy.__version__); print('scipy', scipy.__version__); print('sklearn', sklearn.__version__)"

      - name: Download shared fixtures
        uses: actions/download-artifact@v4
        with:
          name: node-reference-inputs
          path: downloaded

      - name: Run Python reference (current)
        run: |
          mkdir -p artifacts/python
          python analysis-prototype/reference/ci_python.py downloaded/inputs/fixtures.json artifacts/python --label current --diagnostic-fixtures downloaded/inputs/diagnostic-fixtures.json

      - name: Upload python-reference-current artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-reference-current
          path: artifacts/python
          retention-days: 7

  python-reference-legacy:
    name: B2. python-reference-legacy (scikit-learn 1.5.1, diagnostic only)
    runs-on: ubuntu-latest
    needs: node-reference-inputs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned legacy Python packages
        run: |
          pip install \
            numpy==${{ env.NUMPY_VERSION_LEGACY }} \
            scipy==${{ env.SCIPY_VERSION_LEGACY }} \
            scikit-learn==${{ env.SCIKIT_LEARN_VERSION_LEGACY }}
          python --version
          python -c "import numpy, scipy, sklearn; print('numpy', numpy.__version__); print('scipy', scipy.__version__); print('sklearn', sklearn.__version__)"

      - name: Download shared fixtures
        uses: actions/download-artifact@v4
        with:
          name: node-reference-inputs
          path: downloaded

      - name: Run Python reference (legacy)
        run: |
          mkdir -p artifacts/python
          python analysis-prototype/reference/ci_python.py downloaded/inputs/fixtures.json artifacts/python --label legacy --diagnostic-fixtures downloaded/inputs/diagnostic-fixtures.json

      - name: Upload python-reference-legacy artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-reference-legacy
          path: artifacts/python
          retention-days: 7

  r-reference:
    name: C. r-reference
    runs-on: ubuntu-latest
    needs: node-reference-inputs
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      # Installs smacof and jsonlite (the only two packages ci_r.R actually
      # imports) from RStudio Package Manager's public binary repository
      # instead of building from CRAN source. This avoids compiling smacof's
      # full transitive dependency tree (Hmisc, weights, and Hmisc's own
      # optional deps htmlTable/rmarkdown) on the runner, which failed in
      # attempt 2. No dependency is skipped or excluded — setup-r-dependencies
      # resolves and installs the full dependency graph, just from prebuilt
      # binaries rather than source.
      - name: Install R dependencies (smacof, jsonlite) via public RSPM binaries
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::smacof
            any::jsonlite

      - name: Verify R packages actually load and record exact versions
        run: |
          R --version
          Rscript -e 'cat(as.character(packageVersion("smacof")), "\n")'
          Rscript -e 'cat(as.character(packageVersion("jsonlite")), "\n")'
          Rscript -e 'library(smacof); library(jsonlite); cat("r-packages-ok\n")'
          Rscript -e 'sessionInfo()'

      - name: Download shared fixtures
        uses: actions/download-artifact@v4
        with:
          name: node-reference-inputs
          path: downloaded

      - name: Run R reference
        run: |
          mkdir -p artifacts/r
          Rscript analysis-prototype/reference/ci_r.R downloaded/inputs/fixtures.json artifacts/r downloaded/inputs/diagnostic-fixtures.json

      - name: Upload r-reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-reference
          path: artifacts/r
          retention-days: 7

  compare:
    name: Compare TS vs Python (current+legacy) vs R
    runs-on: ubuntu-latest
    needs: [node-reference-inputs, python-reference-current, python-reference-legacy, r-reference]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --ignore-scripts: see node-reference-inputs job for why (no
      # DATABASE_URL in this workflow, and this job never needs the
      # generated Prisma client either — it only runs compareReferences.ts).
      - name: npm ci --ignore-scripts
        run: npm ci --ignore-scripts

      - name: Verify Node/npm/tsx are actually usable after --ignore-scripts
        run: |
          node --version
          npm --version
          npx -y tsx --version
          node -e "console.log('node-runtime-ok')"

      - uses: actions/download-artifact@v4
        with:
          name: node-reference-inputs
          path: downloaded/node

      - uses: actions/download-artifact@v4
        with:
          name: python-reference-current
          path: downloaded/python-current
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: python-reference-legacy
          path: downloaded/python-legacy
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: r-reference
          path: downloaded/r
        continue-on-error: true

      - name: Run comparison
        run: |
          mkdir -p artifacts/comparison
          npx -y tsx analysis-prototype/scripts/compareReferences.ts \
            downloaded/node/inputs/fixtures.json \
            downloaded/node/typescript \
            downloaded/python-current \
            downloaded/r \
            artifacts/comparison \
            downloaded/python-legacy

      - name: Write step summary
        if: always()
        run: cat artifacts/comparison/comparison-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Assemble final combined artifact
        if: always()
        run: |
          mkdir -p final/concept-analysis-validation/metadata
          mkdir -p final/concept-analysis-validation/inputs
          mkdir -p final/concept-analysis-validation/typescript
          mkdir -p final/concept-analysis-validation/python-current
          mkdir -p final/concept-analysis-validation/python-legacy
          mkdir -p final/concept-analysis-validation/r
          mkdir -p final/concept-analysis-validation/comparison
          cp -r downloaded/node/metadata/. final/concept-analysis-validation/metadata/ || true
          cp -r downloaded/node/inputs/. final/concept-analysis-validation/inputs/ || true
          cp -r downloaded/node/typescript/. final/concept-analysis-validation/typescript/ || true
          cp -r downloaded/python-current/. final/concept-analysis-validation/python-current/ || true
          cp -r downloaded/python-legacy/. final/concept-analysis-validation/python-legacy/ || true
          cp -r downloaded/r/. final/concept-analysis-validation/r/ || true
          cp -r artifacts/comparison/. final/concept-analysis-validation/comparison/ || true
          # No production DB, no rrrvvnux data, no adminToken/participantName/
          # phoneNumber, no env vars, and no GitHub/Railway tokens are ever
          # written to these directories by any script in this workflow.

      - name: Upload final combined artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-analysis-validation
          path: final/concept-analysis-validation
          retention-days: 7

      # compareReferences.ts only sets a nonzero exit code for FAILED, so
      # this job could otherwise report "success" while the true research
      # verification state is PARTIALLY_VERIFIED or NOT_RUN. This step
      # reads ONLY comparison-summary.json (no other logic, no algorithm
      # code) and makes the job's pass/fail match the true state: VERIFIED
      # is the only status that exits 0.
      - name: Enforce VERIFIED-only job success
        if: always()
        run: |
          if [ ! -f artifacts/comparison/comparison-summary.json ]; then
            echo "comparison-summary.json not found -- treating as NOT_RUN."
            exit 1
          fi
          STATUS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('artifacts/comparison/comparison-summary.json','utf-8')).overallStatus)")
          echo "Final research verification status: $STATUS"
          if [ "$STATUS" != "VERIFIED" ]; then
            echo "Status is not VERIFIED -- failing this job so its conclusion matches the true research verification state."
            exit 1
          fi
